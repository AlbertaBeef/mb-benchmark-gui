# mb-benchmark — unattended model sweep.
#
#   ./build/mb-benchmark --automation config/automation-models.conf
#
# Every model in config/models.conf, in catalog order, one run each. This is the
# equivalent of the old "model sweep" checkbox, except that it is written down:
# reorder the lines, delete the ones you do not want, or repeat a line to run
# something twice. See automation-pipelines.conf and automation-test.conf.
#
# ---------------------------------------------------------------------------
# FORMAT
#
# [automation] — timings and the default accelerator configuration
#   start     = <minutes>   delay before the FIRST run only
#   benchmark = <minutes>   default run length
#   idle      = <minutes>   default cool-down between runs, 0 for back-to-back
#   end       = <minutes>   after the LAST run, keep logging this long and then
#                           close the app. Omit to leave the app open.
#   loop      = true|false  wrap at the end of the list, or stop after one pass
#
#   accelerators   = all | none | <vendor> [<vendor> …]   which cards run
#   <vendor>.api     = sync | async
#   <vendor>.depth   = <n>        frames in flight (Axelera's ceiling is 2)
#   axelera.cores    = 1-4        AIPU cores — see the warning below
#   memryx.freq      = <MHz>      MPU clock
#   qualcomm.nsps    = 1-2        Hexagon NSPs
#   qualcomm.perf    = burst | sustained_high_performance | balanced | power_saver
#   qualcomm.backend = htp | gpu | cpu
#
#   <vendor> is hailo, memryx, deepx, axelera or qualcomm.
#
# [plan] — the ordered step list
#   model    = <id>[, <name>=<value> …]
#   pipeline = <id>[, <name>=<value> …]
#
#   The id is the catalog id — the part after the colon in a [model:…] section
#   of models.conf, NOT the display name. Ids carry no spaces, so nothing needs
#   quoting. Any [automation] key above may be repeated on a step to override it
#   for that step alone, plus `benchmark=` and `idle=`. Options are named, not
#   positional, so you can set one knob without restating the rest.
#
#   Examples:
#     model = yolov8s, benchmark=60                 run this one for an hour
#     model = resnet50, axelera.cores=3             more cores, this step only
#     model = osnet, accelerators=hailo deepx       just those two cards
#     model = resnet50, hailo.api=sync, hailo.depth=1
#
# Steps run top to bottom. A subject no compiled-in card has an artifact for is
# skipped and named in the log rather than started and left producing nothing.
# '#' starts a comment. Section headers in [brackets] are decorative.
# ---------------------------------------------------------------------------

[automation]
# The cards have just been powered or the app has just launched; let the
# telemetry settle and any startup downloads land before the first run.
start = 5
# 30 minutes clears the 20-minute bar tools/csv-to-html-plot.py wants before it
# will report a sustained frame rate, with room for the parts to heat first.
benchmark = 30
# Cool-down with nothing loaded. 0 would run them back-to-back, but then each
# run starts on a hot card and its cold frame rate is not measuring a cold part.
idle = 10
# One pass through the list. Set true to keep cycling indefinitely.
loop = false
# Keep logging for ten minutes after the last run so the cards' cool-down is on
# record, then close the app — which releases the devices and finalises the CSV.
# Omit this line to leave the window open when the plan finishes.
end = 10

# Accelerator defaults for every step below.
#
# `accelerators` is deliberately left unset so this file works on both hosts —
# unset means "whatever the panel already has ticked", which is every card the
# build has. Setting it to a list would silently exclude Qualcomm on the
# IQ-9075, or the four M.2 cards on x86_64. Uncomment and edit to pin it:
# accelerators = hailo memryx deepx axelera
hailo.api     = async
hailo.depth   = 4
memryx.api    = async
memryx.depth  = 4
deepx.api     = async
deepx.depth   = 4
axelera.depth = 2
axelera.cores = 4

[plan]
# Eight models. At 30 + 10 minutes each, one pass is about 5h20m.
model = resnet50
model = yolov8s
model = yolov8m
model = osnet
model = scrfd_500m
model = scrfd_2.5g
model = scrfd_10g
model = arcface
