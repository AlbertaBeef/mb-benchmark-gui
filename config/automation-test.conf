# mb-benchmark — automation smoke test, ~24 minutes.
#
#   ./build/mb-benchmark --automation config/automation-test.conf
#
# For watching the automation transitions before committing to a real sweep.
# Not a measurement: two minutes is far too short for a frame rate to settle,
# and tools/csv-to-html-plot.py will (correctly) refuse to report a sustained
# figure for runs this brief.
#
# It is arranged to exercise every path the driver has:
#
#   * start != idle != end      — the three waits are separate settings
#   * eight steps in a row      — step advance across both tabs
#   * a per-step benchmark=     — a duration override being honoured
#   * a per-step accelerators=  — restricting which cards one step uses
#   * a per-step api / cores    — settings applied per step, not once per run
#   * a step AFTER a restricted — the regression check below
#   * pipelines after models    — the Pipelines-tab switch in the selector
#   * loop = false              — the "plan complete" ending, so the session
#                                 stops on its own instead of running all night
#   * end                       — the app closes itself afterwards, which is
#                                 what makes an overnight run unattended
#
# REGRESSION CHECK — step 2 vs step 3.
#
# Step 2 restricts itself to Hailo+DeepX and forces Hailo to Sync. Step 3 says
# nothing about either, so it must come back to ALL cards with Hailo async.
#
# It did not, before 2026-08-08: widget state is sticky and a step was applied
# as a delta on the previous one, so step 2's restrictions silently persisted
# and a later step configured cards that were not running. Settings are now
# applied as baseline + [automation] defaults + step.
#
# What that looks like in the CSV, per step, in the <vendor>_cfg columns:
#
#   step 2 (yolov8s)  hailo = "Sync API · depth 1", deepx set, memryx and
#                     axelera EMPTY
#   step 3 (yolov8m)  all four set again, hailo back to "Async API · depth 4"
#
# If step 3 still shows only Hailo and DeepX, or Hailo still in Sync, the leak
# is back.
#
# Expected sequence in the status line and in the CSV `message` column:
#
#   start 1:00
#     → resnet50        2:00 → idle 1:00
#     → yolov8s         1:00 → idle 1:00   (Hailo Sync + DeepX only)
#     → yolov8m         2:00 → idle 1:00   (all cards, Hailo async again)
#     → osnet           2:00 → idle 1:00
#     → scrfd_2.5g      2:00 → idle 1:00
#     → arcface         2:00 → idle 1:00
#     → track_yolov8m   2:00 → idle 1:00
#     → face_scrfd_2.5g 2:00
#     → "plan complete" → end 1:00 → the app closes itself
#
# Worth watching for on the x86_64 host: Axelera is in bootloader after a cold
# boot, so the first run loads its firmware and that step will look slow to
# start. MemryX is the card that wedged under fast cycling — if a run sticks in
# "Stopping", that is the stall report doing its job, not automation hanging,
# and the app will deliberately NOT close itself while a card holds a device.

[automation]
start     = 1
benchmark = 2
idle      = 1
loop      = false
end       = 1

hailo.api     = async
hailo.depth   = 4
memryx.api    = async
memryx.depth  = 4
deepx.api     = async
deepx.depth   = 4
axelera.depth = 2
axelera.cores = 1

[plan]
model    = resnet50
model    = yolov8s, benchmark=1, accelerators=hailo deepx, hailo.api=sync
model    = yolov8m
model    = osnet
model    = scrfd_2.5g
model    = arcface
pipeline = track_yolov8m, axelera.cores=1
pipeline = face_scrfd_2.5g, axelera.cores=1
