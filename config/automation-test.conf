# mb-benchmark — short automation smoke test, ~10 minutes.
#
#   ./build/mb-benchmark --automation config/automation-test.conf
#
# For watching the automation transitions before committing to a real sweep.
# Not a measurement: two minutes is far too short for a frame rate to settle,
# and tools/csv-to-html-plot.py will (correctly) refuse to report a sustained
# figure for runs this brief.
#
# It is arranged to exercise every path the driver has:
#
#   * start != idle             — the first wait differs from the later ones
#   * two models in a row       — step advance
#   * a per-step benchmark=     — a duration override being honoured
#   * a per-step accelerator    — settings applied per step, not once per run
#   * a per-step accelerators=  — restricting which cards a step uses
#   * a pipeline after a model  — the Pipelines-tab switch in the selector
#   * loop = false              — the "plan complete" ending, so the session
#                                 stops on its own instead of running all night
#   * end                       — the app closes itself afterwards, which is
#                                 what makes an overnight run unattended
#
# Expected sequence in the status line and in the CSV `message` column:
#
#   start 1:00 → resnet50 2:00 → idle 1:00 → yolov8s 1:00 (Hailo+DeepX only)
#              → idle 1:00 → track_yolov8s 2:00 → "plan complete" → end 1:00
#              → the app closes itself
#
# Check afterwards that the <vendor>_cfg columns changed between step 1 and
# step 2 — that is the per-step settings actually reaching the runners.
#
# Worth watching for on the x86_64 host: Axelera is in bootloader after a cold
# boot, so the first run loads its firmware and that step will look slow to
# start. MemryX is the card that wedged under fast cycling — if a run sticks in
# "Stopping", that is the stall report doing its job, not automation hanging.

[automation]
start     = 1
benchmark = 2
idle      = 1
loop      = false
end       = 1

hailo.api     = async
hailo.depth   = 4
memryx.api    = async
memryx.depth  = 4
deepx.api     = async
deepx.depth   = 4
axelera.depth = 2
axelera.cores = 4

[plan]
model    = resnet50
model    = yolov8s, benchmark=1, accelerators=hailo deepx, hailo.api=sync
pipeline = track_yolov8s, axelera.cores=1
