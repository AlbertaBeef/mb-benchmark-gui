# mb-benchmark — Hailo-8 thermal response to fan duty. ~2h 13m.
#
#   ./build/mb-benchmark --automation config/automation-thermal-hailo.conf
#
# ONE continuous run under constant full load, with the RA6M5 board's fan held
# off until the card has settled into thermal throttling, then ramped. The point
# is the card's response to cooling, so the load must never change: a single
# step, no sweep, no stop/start. Run config/automation-thermal-deepx.conf after
# this one, not alongside it.
#
# SHAPE OF THE RUN
#
#   start      3 min   idle, nothing loaded — the idle temperature baseline
#   0-30 min   fan 0 % — heat up, throttle, and settle
#   30-125 min fan 5 % rising 1 % per minute to 100 %
#   end        5 min   load off, fan still at 100 % — the cool-down curve
#
# The soak is 30 minutes to MATCH THE DX-M1 PLAN. The two cards have very
# different thermal time constants (see below and in the DeepX plan), and
# normalising the soak is what makes the two ramps directly comparable: the
# same 30 minutes of settling, the same 95-minute ladder, so a difference
# between the two curves is the card and not the schedule. It is far longer
# than this card needs on its own — it plateaus inside 5 minutes.
#
# WHAT 30 MINUTES BUYS, measured rather than guessed. From the two longest
# continuous Hailo ResNet-50 runs in logs/ (max of TS0/TS1):
#
#   t (s)      0    30    60    90   120   150   180   210   240   270   300
#   20260808  51.7  69.1  77.9  84.9  90.7  95.8  99.9 103.6 104.7 105.1 106.6
#       fps    736  1220  1227  1222  1231  1218  1225  1222 *1079  1080  1076
#   20260904  53.1  71.7  82.1  90.2  95.8 100.4 103.8 104.3 105.3 106.2 107.3
#       fps    812  1379  1366  1374  1377  1374 *1199  1200  1204  1203  1197
#
#   * = throttle onset, where fps steps down ~12 % and stays down.
#
# So: throttling begins at 180-240 s and ~104 C; the temperature plateaus at
# 105-108 C by ~300 s. The 20260808 run then held 106-108 C with fps cycling
# 925-1080 for a further 17 minutes with no drift, so the plateau is genuinely
# stationary rather than still climbing slowly.
#
# 30 minutes therefore gives the 5-minute approach plus 25 minutes of stationary
# throttled running before the fan is touched — about five times the settling
# the card actually needs. The cost is 20 idle-ish minutes per run; what it buys
# is a long, clean baseline of the unaided thermal plateau to compare the whole
# ramp against, and a schedule identical to the DX-M1's. Note it also takes the
# card past the longest fan-off stretch on record here (22 min at 106-108 C),
# which that run survived with the card healthy afterwards.
#
# Note the throttled state is an OSCILLATION, not a flat line: fps bounces
# between roughly two levels as the card throttles and recovers. A single
# sample from it means nothing; take a mean over minutes.
#
# WHY RESNET-50, ASYNC, DEPTH 8 — the hottest thing this card does, which is
# what a cooling experiment wants. Every thermal figure above is ResNet-50, so
# the new run is directly comparable with them.
#
# WHY accelerators = hailo — the shipped sweep plans deliberately leave this
# unset ("whatever the panel has ticked"), but a single-card thermal test wants
# exactly one card drawing power and nothing else contributing heat or PCIe
# traffic. It also keeps the Axelera out of the run, which matters: a device
# init while another card is active is an open, unexplained failure on this host
# that wedges the Metis or kills the machine (see CLAUDE.md). This plan never
# touches it.
#
# FAN DUTY IS QUANTISED, and the analysis has to know. The EMC2101 has 64
# levels, so a request is rounded to the nearest 1/63 = 1.587 %: `fan 6` and
# `fan 7` both apply 6.3 %. Verified on hardware 2026-11-19. Of the 96 one-
# percent requests below, about 35 land on the level the previous minute
# already set, so the ramp holds for two minutes at those points. That is
# harmless for a response curve but it is NOT a 96-point ladder.
#   * Read the APPLIED duty from the CSV's `usb <port>_FAN_DUTY` column, which
#     is the board's own readback, never the requested percent.
#   * A fractional step would give one distinct level per minute, but the
#     panel's duty spin is whole-percent, so keep the step an integer here
#     until that is checked on a real display.
#
# WHAT ELSE TO EXPECT IN THE CSV
#   * `usb <port>_FAN_RPM` is live — the breakout's TACH jumper is bridged on
#     this board, confirmed 2026-11-19 (0 -> 1663 -> 2694 rpm at 20.6 % duty).
#   * `usb <port>_AIRFLOW` responds within a second or two but is noisy while
#     the fan settles; 0.005 m/s at rest, ~1-2 m/s at 20 %.
#   * Hailo power comes from the RA6M5's own INA228, which is mapped to Hailo
#     in config/ina228.conf — so fps/W and mJ/frame are real for this run.
#     Cross-checked against the card's own sensor: 0.857 W vs 0.845 W idle.
#   * The GUI's graphs only retain 30 minutes. This run is longer than that, so
#     read the CSV for anything before the last half hour.
#
# The fan duty is applied from the START OF THE RUN, so the 3-minute `start`
# settle keeps whatever duty the fan already had. If a previous session left it
# at 100 %, the card will settle cold and the fan will switch off exactly as the
# load begins — a clean initial condition. Set it to 0 by hand first if you
# would rather the settle be fanless too.
#
# The firmware keeps its duty after the app exits, so the fan is STILL AT 100 %
# when this plan finishes. The DeepX plan sets it back to 0 at its own start;
# otherwise stop it by hand.

[automation]
start     = 3
# 30 min of fan-off soak + 95 min of ramp (5 % to 100 % at 1 %/min).
benchmark = 125
loop      = false
end       = 5

# One card, and it is the one being cooled.
accelerators = hailo

# The hottest configuration this card has, held constant for the whole run.
hailo.api   = async
hailo.depth = 8

# Fan: off, then ramp. `fan` is the duty held from the start of the run;
# the ramp takes over `fan.after` into it. Intervals are minutes, like every
# other duration in a plan.
fan       = 0
fan.start = 5
fan.step  = 1
fan.every = 1
fan.after = 30
fan.max   = 100

[plan]
model = resnet50
