# mb-benchmark — DeepX DX-M1 thermal response to fan duty. ~2h 13m.
#
#   ./build/mb-benchmark --automation config/automation-thermal-deepx.conf
#
# The companion to config/automation-thermal-hailo.conf — same experiment, one
# card, and since 2026-11-19 the SAME SCHEDULE: 30 minutes of soak then the same
# 95-minute ramp, so a difference between the two cards' curves is the card and
# not the timing. RUN IT AFTER the Hailo plan, not at the same time: two cards
# under load put two heat sources in front of one fan and neither curve means
# anything afterwards.
#
# SHAPE OF THE RUN
#
#   start      3 min   idle, nothing loaded — the idle temperature baseline
#   0-30 min   fan 0 % — heat up and settle
#   30-125 min fan 5 % rising 1 % per minute to 100 %
#   end        5 min   load off, fan still at 100 % — the cool-down curve
#
# 30 MINUTES IS THE BINDING CARD'S NUMBER, AND THIS IS THE BINDING CARD. The
# shared soak is set by whichever card settles slower, and that is this one by a
# wide margin. Measured from the 23.7-minute DeepX ResNet-50 run in
# logs/mb-benchmark-20261102-132045.csv:
#
#   t (s)    0   125   250   376   504   631   759   886  1013  1141  1236
#   degC    45    61    69    76    80    83    85    87    87    88    88
#   fps    789  1055  1058  1089  1075  1083  1079  1085  1073  1032  1052
#
# Two differences from the Hailo that matter for the plan:
#
#   * IT THROTTLES LATER AND MUCH MORE GENTLY THAN THE HAILO. This note said
#     "the DX-M1 does not throttle" until 2026-11-19, on the strength of the
#     23.7-minute run above: fps sits at 1030-1090 for its whole length while
#     the die climbs 45 -> 88 C. The 125-minute run below disproves that — the
#     card simply had not been held at the plateau long enough. At 89 C the
#     frame rate settles to 979 against 1083 while warming, a 9.6 % loss, and
#     it comes back in full when the fan arrives. There IS a throttle onset to
#     wait past; it is just slow and shallow next to the Hailo's step-down.
#
#     AND THE CLOCK COLUMN WILL NOT SHOW IT TO YOU. `dxrt-cli` reports an
#     instantaneous clock: it caught 1000 -> 800 MHz in 9.9 % of the samples in
#     the throttling window, while the (1 s averaged) frame rate implies ~41 %
#     of the time at 800. Samples reporting a flat 1000 MHz on all three cores
#     still carry 8.1 % of the loss. Judge throttling from `deepx_fps`, never
#     from `_C0/_C1/_C2`.
#   * ITS THERMAL TIME CONSTANT IS MUCH LONGER — about 6x the Hailo's. That
#     card plateaus by 300 s; this one is still climbing at 850 s and only
#     flattens at 87-88 C somewhere around 1000-1250 s. Starting the ramp while
#     the die is still drifting up would mix the two effects and spoil the
#     curve, so the soak has to clear the asymptote with margin: 30 min is
#     ~1800 s against the ~1250 s where it last moved.
#
#     ONE CAVEAT ON THAT MARGIN: the longest DX-M1 run on record here is the
#     23.7 minutes above, so the last ~6 minutes of this soak go past anything
#     measured. The trace was flat at 88 C for its final 4 minutes, so a further
#     drift is unlikely — but if the temperature is still climbing at 30 min,
#     that is a new fact about the card, not a fault in the plan. Check the
#     first 30 minutes of the CSV before trusting the ramp that follows it.
#
# It also runs ~43 C cooler than the Hailo at the same point in the experiment
# (88 vs 108 C), so expect the fan to have far less to do here.
#
# POWER NEEDS THE SHUNT REMAPPED, AND IT IS EASY TO LOSE SILENTLY. DeepX has no
# on-die power sensor, so its watts come from the RA6M5 board's INA228 — which
# means `config/ina228.conf` must map that board's serial to DeepX. It was
# mapped to Hailo until 2026-11-19. Get this wrong and the failure is quiet:
# `accel_present()` hides the absent Hailo, the shunt folds onto a card that is
# not there, and `deepx_fps_per_w` plus the mJ/frame column read 0 for the whole
# run with no error anywhere (CLAUDE.md: never estimate watts). CHECK THE
# STARTUP NOTE FOR `INA228 -> DeepX` BEFORE COMMITTING TWO HOURS. Do not map
# two shunts to one card.
#
# Its temperatures come from `dxrt-cli -s` and arrive as WHOLE DEGREES, so a
# 1 C step in the data is the sensor's resolution, not a real 1 C jump. Fit the
# curve rather than differencing adjacent samples.
#
# WHY RESNET-50, ASYNC, DEPTH 4 — ResNet-50 is what every thermal figure above
# was taken with, and depth 4 is this card's saturation point: measured
# 1 -> 402 fps, 4 -> 1085, 8 -> 1062, so 8 is past the knee and buys nothing
# but noise. async because sync is a fifth of the throughput and so a fraction
# of the heat.
#
# WHY accelerators = deepx — one card drawing power, and it keeps the Axelera
# out of the run. See the Hailo plan for why that second part matters.
#
# Everything in the Hailo plan's notes about fan quantisation (64 levels,
# 1.587 % apart, so ~35 of the 96 one-percent steps repeat the previous one),
# about reading the applied duty from `_FAN_DUTY` rather than the request, and
# about the GUI keeping only 30 minutes of graph, applies here unchanged.
#
# This plan sets the fan back to 0 at the start of its run, which undoes the
# 100 % the Hailo plan leaves behind. The firmware keeps its duty after the app
# exits, so the fan is again at 100 % when this one finishes — stop it by hand.

[automation]
start     = 3
# 30 min of fan-off soak + 95 min of ramp (5 % to 100 % at 1 %/min).
# Identical to the Hailo plan's, deliberately.
benchmark = 125
loop      = false
end       = 5

accelerators = deepx

deepx.api   = async
deepx.depth = 4

fan       = 0
fan.start = 5
fan.step  = 1
fan.every = 1
fan.after = 30
fan.max   = 100

[plan]
model = resnet50
