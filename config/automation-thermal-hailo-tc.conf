# Where does the Hailo-8's thermal loop get its temperature from, and how much
# does that cost?
#
#   ./build/mb-benchmark --automation config/automation-thermal-hailo-tc.conf
#
# Needs firmware mb-probe-ra6m5 >= 0.6.0, and the app must be RESTARTED after
# flashing it: the host fixes its metric list and CSV header at discovery and
# never reconnects.
#
# Since 0.6.0 the board's loop has ONE mode. It always regulates the estimated
# on-die temperature, power is mandatory, and the thermocouple is one of three
# possible sources for the single signal it needs:
#
#   1  fan.tc = on                 the physical thermocouple    -> CLOSED loop
#   2  fan.tc = off, fan.nn = off  the static model only        -> OPEN loop
#   3  fan.tc = off, fan.nn = on   a learned estimate of it     -> CLOSED loop
#
# The control law is identical in all three; only where `tc_` comes from
# changes. That is the point of putting a soft sensor on the board at all — it
# is a drop-in for one input, not a second controller.
#
# THREE ARMS, ONE SETPOINT. The arms differ in `fan.tc` / `fan.nn` ALONE — same
# model, same card, same 90 C, same starting condition — so any difference
# between them is the source of the temperature and nothing else. Arm 1 is both
# the reference the other two are scored against and the source of their
# training labels, since the card's own die sensor is in every row of the CSV.
#
# WHY 90 C AND NOT THE `auto` 95. Arms 2 and 3 have either no feedback at all or
# feedback through an estimate, so model error goes into the die uncorrected.
# The throttle boundary is hysteretic AND stochastic — throttling seen anywhere
# from 98.9 to 104.2 C, and two runs disagreed at the same 101.6 / 101.7 C — so
# 5 C of margin lets an arm be wrong without inviting a throttle into the
# measurement. `fan.target = auto` is the right thing in service; it is the
# wrong thing in an experiment whose point is to find out how wrong a model is.
#
# THE START AND END ARE THE SAME MEASUREMENT, TAKEN TWICE. Thirty minutes of
# fan off with the card idle, at both ends. Differencing them is how session
# drift is told from effect, and this run needs that: board air moved 2.5 C
# across the four-setpoint run at 0.25 C resolution, and R_int looks duty
# dependent (1.619 C/W at 32-41 % duty against 1.742 at 58-61 %). `end` is
# deliberately spent still logging, so the closing bracket costs only time.
#
# `fan.idle` is what makes that expressible, and it is new in this firmware's
# host support. A bare `fan` is refused alongside `fan.mode` — correctly, the
# loop would override it — and the plan-level fan is only ever applied while a
# benchmark is running, so nothing else reaches the start pause.
#
# ARM 3 MEASURES NOTHING ON THE FIRST RUN, and that is deliberate rather than a
# gap. No model is compiled in yet, so the board accepts `ctl.nn on`, reports
# `ctl.nn = 0` with `ctl.state = 6` (degraded), and runs open. The alternative
# was refusing the key at load, which is fatal by design and would mean keeping
# two scripts. So the first execution yields:
#
#   arm 1  the reference, plus ~1 800 thermocouple-labelled samples at a held
#          setpoint with the duty driven by a closed loop
#   arm 2  the baseline a learned estimate has to beat
#   arm 3  a SECOND independent sample of arm 2's configuration — which is not
#          wasted: without it, no later arm-2-vs-arm-3 difference can be called
#          real rather than run-to-run spread
#
# Train on arm 1 plus the two thermocouple-labelled runs already on disk
# (docs/data/ra6m5-thermal-hailo8-20261122.csv, 21 179 samples across 59 fan
# treads, and logs/mb-benchmark-20261122-221548.csv, 13 502 at four setpoints),
# compile the model in, then re-run this file unchanged.
#
# WHAT TO READ AFTERWARDS — the run scores itself, PER ARM:
#
#   _CTL_SRC          which source each arm actually used. 0 measured,
#                     1 inferred, 2 none. Check this FIRST: it is the only
#                     thing that says whether an arm ran as configured.
#   _CTL_DIE_EST      the board's model of the die
#   0000:*_TS0        the card's own sensor, i.e. the truth
#                     -> their difference per arm is the whole experiment. Arm 1
#                        should reproduce the four-setpoint run's <= 0.68 C;
#                        arms 2 and 3 are the numbers this exists to produce.
#   _CTL_IN vs
#   _CTL_TARGET       did each arm hold 90 C, and how fast did it get there?
#                     Arm 2 reports no `in` at all — open loop measures nothing,
#                     so quoting an error would invent one.
#   _CLK              400 MHz throughout. Judge throttling from the clock and
#                     the frame rate, never from temperature alone.
#   _CTL_DUTY         inside 9.5-73 %. At 73 the fan has saturated and the loop
#                     is out of authority; at 9.5 the setpoint is slack.
#   _CTL_STATE        0 off 1 settling 2 holding 3 floor 4 ceiling 5 open
#                     6 degraded 7 fault. Arm 1 should settle to 2; arm 2 to 5;
#                     arm 3 to 6 until a model exists.
#   the two brackets  the opening `start` against the closing `end`, same
#                     conditions, 30 min each: board air, heatsink and die at
#                     rest. Any difference is drift over the session.

[automation]
start     = 30          # fan OFF, card idle — the opening baseline
benchmark = 30
idle      = 30
loop      = false
end       = 30          # fan OFF, card idle — the SAME baseline, repeated

# Matching the earlier thermal plans so the runs stay comparable.
hailo.api   = async
hailo.depth = 8

# The fan is off whenever no loop is driving: the start pause, the idles
# between arms, and the closing bracket. The one fan key allowed beside
# fan.mode, because it is the complement of the loop rather than a rival to it.
fan.idle = 0

# 1  reference — the physical thermocouple, closed loop
model = resnet50, fan.mode = on, fan.tc = on,  fan.nn = off, fan.target = 90, benchmark = 30
# 2  baseline  — no thermocouple, static model only, open loop
model = resnet50, fan.mode = on, fan.tc = off, fan.nn = off, fan.target = 90, benchmark = 30
# 3  candidate — no thermocouple, a learned estimate standing in for it
model = resnet50, fan.mode = on, fan.tc = off, fan.nn = on,  fan.target = 90, benchmark = 30

# 210 minutes, 3 h 30 m: 30 start + 3 x 30 loaded + 2 x 30 idle + 30 end. The
# idle falls BETWEEN steps only — the four-setpoint run took 225 min, not the
# 255 its own header predicted, which is where that arithmetic comes from.
