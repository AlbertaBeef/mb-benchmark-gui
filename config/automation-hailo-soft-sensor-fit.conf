# Hailo-8 soft-sensor fitting run — the W axis at four fan duties
#
# ~4 h 08 m, 24 treads. This is the run the soft sensor is fitted from. It
# exists because the two datasets already on disk each cover ONE axis:
#
#   the 2026-11-22 fan ladder    Rconv(duty) over 59 duty levels, at ONE load
#                                (4.2-4.9 W; only 0 % and 100 % ever saw idle
#                                power as well)
#   the 2026-11-23 load probe    eight loads over a 6.9x span (1.116-7.712 W),
#                                at ONE duty (73 %)
#
# Neither can say whether the two axes separate. This run crosses them.
#
# WHAT IS BEING FITTED.  tc_steady = air + W * Rconv(duty), with
# d(tc_hat)/dt = (tc_steady - tc_hat) / tau(duty) — three or four physically
# interpretable parameters, monotone in duty. Every tread yields BOTH a
# steady-state point and a tau, from the same transient.
#
# WHY THIS RUN AND NOT THE CORPUS ALREADY ON DISK. 11 703 of the 47 282
# thermocouple-labelled samples had duty set BY a controller reading tc.
# Fitting those learns the controller's inverse, not the plant. Here the duty
# is a fixed number from this file and the thermocouple is logged but never
# consulted, so every sample is identifying.

# ---------------------------------------------------------------------------
# THE (W, duty) SPACE IS A TRIANGLE, NOT A RECTANGLE — this is what shapes the
# schedule, and it was not knowable before the load probe ran.
#
# Crossing the load probe's eight loads with the ladder's Rconv(duty) at the
# 95 C zero-throttle bound (Rint 1.81, air 23 C) gives the lowest duty each
# load survives:
#
#   OSNet 1.12 W, SCRFD-500M 3.10, YOLOv8m 3.22    0 %
#   ArcFace 3.91 W                                 9.5 %
#   SCRFD-2.5G 4.09 W                             17.5 %
#   ResNet-50 4.38 W                              27 %
#   SCRFD-10G 5.06 W                              33 %
#   YOLOv8s 7.71 W                                67 %
#
# So "hold a few fixed duties and step the load within each" — the shape this
# run was sketched with — is NOT realisable across the full range. The heavy
# loads exist only at high duty. Note the uncapped ResNet-50 (4.38 W) does
# NOT fit at 21 % duty: it would reach ~97.5 C and throttle, which is why the
# 21 % segment is capped-only.
#
# THE LADDER'S OWN LOW-DUTY DATA IS THROTTLED DATA. At 9.5 % it measured
# 4.722 W and Rconv 15.86, which implies a 106 C die — the thermal plans
# deliberately ran the card into throttle and it plateaus at 105-108 C. That
# is why its low-duty Rconv is not a clean plant measurement and why this run
# stays under 95 C everywhere.
#
# THE FRAME-RATE CAP IS THEREFORE LOAD-BEARING, and not for the reason it was
# added. Capping a model is the only way to put a CHOSEN wattage at a LOW
# duty; swapping models cannot, because the light models are light everywhere.
# It is honest on Hailo — the producer is run_frame(), so the cap bites at
# submission rather than only on counting (CLAUDE.md, "the frame-rate cap was
# cosmetic on three backends").
# ---------------------------------------------------------------------------

[automation]
start     = 5
benchmark = 6           # the 73 % default; each slower segment overrides it
idle      = 1.5         # NOT dead time — the last 30 s of every idle is that
                        # tread's own air baseline. Differencing each tread
                        # against its neighbouring idles is what cancelled both
                        # the session drift and the EMC2101's self-heating in
                        # the load probe, and it is the only reason that run's
                        # Rconv came out to +/-2.7 % rather than +/-6 %.
loop      = false
end       = 5

hailo.api   = async
hailo.depth = 8         # as the ladder, the 0.5.0 run, the three-arm run and
                        # the load probe, so every figure here is comparable

# fan.idle is set per step, equal to that step's `fan`, so the fan holds the
# segment's duty through the start pause and the idles as well as the tread.
# apply_automation_idle_fan() reads settings_for(auto_step_), so this works per
# step. IT IS NOT COSMETIC: the load probe left the fan at whatever the last
# session had (0 %), so its first tread began from a 42.7 C card and was still
# FALLING at the end while its last tread began cold and was still rising —
# which invalidated that run's temperature bracket entirely. Its power bracket
# survived only because power settles fast. Pinning the fan from t=0 is what
# makes the opening and closing treads here comparable.
#
# Three idles out of 23 sit on a segment boundary and so may be held at either
# the preceding or the following duty. Read `usb *_FAN_DUTY` to see which;
# those three baselines belong to whichever tread matches.

# ===========================================================================
# SEGMENT 1 — duty 73 % (the EMC2101's measured max_duty; applied 73.02 %)
#
# Runs FIRST on purpose. It is the only segment that spans the full 1.6-7.7 W
# range, so by the time the capped-only segments run, the W(fps) curve is
# already in the log — meaning that if a cap turned out not to bite, the
# analysis knows which treads to discard instead of being puzzled by them.
# The downside of a cap not biting is bad data for a segment, not a damaged
# card: the Hailo throttles at 98-104 C and has been run to 105-108 C before.
#
# tau here is 56-82 s (measured, load probe), so 6 min is 4.4-6.4 time
# constants.
#
# The uncapped ResNet-50 is tread 1 and is repeated as the last tread of the
# whole run — the session drift bracket, the same device the load probe used.
# ===========================================================================
model = resnet50,   fan = 73, fan.idle = 73, fps = max
model = resnet50,   fan = 73, fan.idle = 73, fps = 500
model = yolov8s,    fan = 73, fan.idle = 73, fps = max
model = resnet50,   fan = 73, fan.idle = 73, fps = 1000
model = yolov8m,    fan = 73, fan.idle = 73, fps = max
model = resnet50,   fan = 73, fan.idle = 73, fps = 300
model = scrfd_10g,  fan = 73, fan.idle = 73, fps = max
model = resnet50,   fan = 73, fan.idle = 73, fps = 700

# ===========================================================================
# SEGMENT 2 — duty 33 % (requested 33, applied 33.33 %)
#
# Rconv 12.27 C/W from the ladder, 1.82x the 73 % figure, so tau scales to
# ~149 s and 10 min is ~4 time constants. This is also the segment nearest the
# duty the closed loop actually held in the 0.5.0 and three-arm runs
# (36.5-37.7 %), so its uncapped tread is the direct tie to those.
# ===========================================================================
model = resnet50,   fan = 33, fan.idle = 33, fps = 700,  benchmark = 10
model = resnet50,   fan = 33, fan.idle = 33, fps = max,  benchmark = 10
model = resnet50,   fan = 33, fan.idle = 33, fps = 300,  benchmark = 10
model = resnet50,   fan = 33, fan.idle = 33, fps = 1000, benchmark = 10
model = resnet50,   fan = 33, fan.idle = 33, fps = 500,  benchmark = 10

# ===========================================================================
# SEGMENT 3 — duty 21 % (requested 21, applied 20.63 %)
#
# Rconv 15.20 C/W, 2.25x the 73 % figure, tau ~185 s, so 13 min is ~4.2 time
# constants. CAPPED ONLY — the uncapped 4.38 W would reach ~97.5 C here. The
# cap ladder drops to 150 rather than rising to 1000, both to stay clear of the
# 4.23 W envelope and to widen this segment's span downward, where it is the
# only segment that can go.
# ===========================================================================
model = resnet50,   fan = 21, fan.idle = 21, fps = 500, benchmark = 13
model = resnet50,   fan = 21, fan.idle = 21, fps = 150, benchmark = 13
model = resnet50,   fan = 21, fan.idle = 21, fps = 700, benchmark = 13
model = resnet50,   fan = 21, fan.idle = 21, fps = 300, benchmark = 13

# ===========================================================================
# SEGMENT 4 — duty 51 % (requested 51, applied 50.79 %)
#
# Rconv 9.88 C/W, 1.46x, tau ~120 s, 8 min is 4 time constants. Placed LAST of
# the four rather than between 73 and 33, so the duty axis is not walked
# monotonically in time — otherwise the session's own drift would alias
# straight onto Rconv(duty), which is the quantity being measured. Same
# argument as the load probe's scrambled model order, and the reason the caps
# are scrambled within every segment above.
# ===========================================================================
model = resnet50,   fan = 51, fan.idle = 51, fps = 300,  benchmark = 8
model = scrfd_10g,  fan = 51, fan.idle = 51, fps = max,  benchmark = 8
model = resnet50,   fan = 51, fan.idle = 51, fps = 1000, benchmark = 8
model = resnet50,   fan = 51, fan.idle = 51, fps = 700,  benchmark = 8
model = resnet50,   fan = 51, fan.idle = 51, fps = max,  benchmark = 8
model = resnet50,   fan = 51, fan.idle = 51, fps = 500,  benchmark = 8

# closing drift bracket — identical to tread 1
model = resnet50,   fan = 73, fan.idle = 73, fps = max

# ===========================================================================
# WHAT TO READ AFTERWARDS
#
#   FIT THE EXPONENTIAL, DO NOT REGRESS THE TAIL. This is the load probe's
#   hardest-won lesson. A least-squares slope over the last 60 s read
#   +1.8 C/min on YOLOv8s and declared every one of its nine treads unsettled;
#   the exponential fit showed they were within 0.91 C of asymptote and within
#   0.2 % in watts. A decaying exponential still has slope while sitting a
#   degree from its asymptote. Fit tc(t) = tc_inf + (tc_0 - tc_inf)exp(-t/tau)
#   over each whole tread and take tc_inf and tau from the fit.
#
#   usb *_FAN_DUTY        the applied level, never the requested percent — the
#                         EMC2101 quantises to 1/63 (1.587 %). Expected
#                         73.02 / 50.79 / 33.33 / 20.63.
#   bench_target_fps      the EFFECTIVE cap, empty = max. THE FIRST THING TO
#                         CHECK: the spin clamps at 1000 silently, so a cap
#                         that reads back wrong invalidates its tread. Confirm
#                         the rail moved with it before trusting any capped W.
#   0000:*_INA228_POWER   the rail, from the exponential fit's asymptote. The
#                         W axis this run exists to build.
#   0000:*_CLK            must be 400 MHz for every sample of every tread. Any
#                         dip means that tread throttled and both its W and its
#                         tc describe a throttled card, not the plant.
#   0000:*_TS0/_TS1       die = max of the two, never a mean. Must stay under
#                         95 C; the 21 % segment is the one at risk.
#   usb *_MAX31855        the heatsink — the quantity being modelled.
#   usb *_EMC2101         the feedforward's `air`, and known to be contaminated
#                         by the card: +0.039 C/W after the session drift is
#                         removed, <=0.25 C over a 6.6 W span, comparable to its
#                         own scatter. Difference each tread against its
#                         neighbouring idles rather than using it raw.
#
# THE THREE QUESTIONS THIS RUN SETTLES
#
# 1 DOES Rconv(duty) SEPARATE FROM W?  The caps {700, 500, 300} run at all four
#   duties, so three matched loads are measured at four duties — 12 points on a
#   complete grid. If Rconv(duty, W) factors as Rconv(duty) the plan's form
#   holds; a systematic residual in the duty-W interaction means it does not.
#
# 2 IS tc - air LINEAR IN W THROUGH THE ORIGIN?  The load probe could not say.
#   Over its seven treads between 3.1 and 5.1 W the through-origin form fitted
#   to 0.33 C rms with exponent 1.009 — dead linear — but pooling all nine
#   pulled the exponent to 0.955 with a 1.89 C residual at YOLOv8s, and
#   dropping EITHER endpoint killed the trend (R2 = 0.006). Two points cannot
#   establish a curvature, and both endpoints were the suspect ones: OSNet's
#   whole rise is 7.8 C, so the air error is 3 % of it, and YOLOv8s was the one
#   tread with a real extrapolation shortfall. Segment 1 answers it with five
#   ResNet-50 points plus three other models spanning 1.6-7.7 W at one duty,
#   all settled, all in one session.
#
# 3 DOES MODEL IDENTITY MATTER AT MATCHED W?  The confound test the `fps` key
#   was added for, and segment 1 contains it: YOLOv8m draws 3.22 W at full rate
#   and the ResNet-50 cap ladder brackets that (700 fps ~ 2.6 W, 1000 fps
#   ~ 3.4 W). Interpolate ResNet-50's tc to 3.22 W and compare. If they match,
#   model identity is irrelevant and every thermocouple-labelled sample on disk
#   pools into one fit; if they do not, the sensor needs an input we have not
#   got. SCRFD-10G appears at both 73 % and 51 % as a second check.
#   The load probe's SCRFD-500M (3.10 W) and ArcFace (3.91 W) are further
#   matched points, but cross-session, so they carry that run's own 2 %
#   repeatability as uncertainty.
#
# THE NOISE FLOOR. The load probe's two ResNet-50 treads — same model, same
# duty, 61 minutes apart — agreed to 0.0120 W (0.27 %), 0.67 C of heatsink rise
# and 2.0 % of Rconv. Nothing smaller than that is a measurement here either.
# The opening and closing treads of this run give the same bound over 4 hours
# instead of 1, which is the number that matters for a 4-hour fit.
#
# EXPECTED W LADDER, so a reader knows the intent — ESTIMATED, not measured.
# Idle is 0.82 W and full rate is 4.383 W at 1372 fps, so if the dynamic term
# is proportional to frame rate: 1000 -> ~3.4 W, 700 -> ~2.6, 500 -> ~2.1,
# 300 -> ~1.6, 150 -> ~1.2. Nothing in the analysis depends on this holding —
# each tread is a (W, duty, tc) point whatever W turns out to be, which is why
# no separate fps-to-watts calibration segment is needed. But if the caps come
# out bunched, the W axis is weaker than planned and segment 1's eight treads
# carry the linearity question alone.
#
# DELIBERATELY NOT HERE. R_int's duty dependence (1.619 C/W at 32-41 % against
# 1.742 at 58-61 %) still needs one setpoint held at two loads, and that is a
# loop experiment, not a fixed-duty one. This run measures (die - tc)/W at four
# duties and several loads, so it CONSTRAINS R_int(duty, W) without closing it.
