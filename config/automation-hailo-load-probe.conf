# Hailo-8 load probe — what does each model actually draw?
#
# ~71 minutes. This measures ONE thing: the rail power of each of the eight
# models on this card, at a fixed fan duty, with nothing throttling. It is a
# PREREQUISITE for fitting the board's soft sensor, not an experiment in its
# own right, and it exists because that number is currently unknown.
#
# WHY IT IS NEEDED. The soft sensor predicts the heatsink thermocouple from
# `tc = air + W * Rconv(duty)`. The 2026-11-22 fan ladder characterises
# Rconv(duty) across all 59 duty levels — but at ONE load: of those 59 levels,
# exactly two (0 % and 100 %, the transitions at each end) ever saw both idle
# and loaded power. Every level in between was measured at W = 4.2..4.9 W.
# So the W axis of that model is untested, and the form assumes `tc - air` is
# linear in W through the origin at fixed duty, which nothing on disk checks.
# Related and already measured: R_int is NOT the constant the same form assumes
# for the die, reading 1.619 C/W at 32-41 % duty against 1.742 at 58-61 %.
#
# WHY MODELS RATHER THAN A FRAME-RATE CAP. Different models are physically
# distinct loads, not one workload throttled, and the objection that they also
# change the layer mix does not apply HERE: the thermocouple is bonded between
# the fins at the centre of the heatsink, and a lump of aluminium that far from
# the die integrates total watts. Where on the die the heat appeared affects the
# DIE-TO-HEATSINK gradient — R_int, which lives in the observer — not the
# heatsink's own rise above air, which is what the soft sensor models. The
# `fps` key exists for the separate matched-W test described at the end.
#
# ONLY RESNET-50 HAS EVER RUN ON THIS CARD. Across every log on disk the
# `bench_model` column carries exactly one value, so the other seven models'
# power is an estimate from GOP/frame x fps and nothing more:
#
#   ResNet-50   8.17 GOP   1369 fps -> 11.2 TOPS achieved
#   YOLOv8s    28.60 GOP    490 fps -> 14.0 TOPS
#   YOLOv8m    78.94 GOP     67 fps ->  5.3 TOPS
#   the other five: no Hailo frame rate recorded anywhere
#
# A 2.6x spread in achieved TOPS should mean a real spread in watts. "Should"
# is why this plan exists.

[automation]
start     = 5           # card idle. NB the fan is NOT yet at 73 % here: the
                        # plan-level fan is applied only while a benchmark is
                        # active, so it holds whatever the last session left
                        # (0 %) until step 1 starts. Consequence: step 1 begins
                        # from a ~43 C card and step 9 from a ~30 C one. Both
                        # treads are 5 min at 73 % = ~4 time constants, and the
                        # reading is the LAST minute, so the difference washes
                        # out — but it is why the drift bracket is read from the
                        # tail and not the mean.
benchmark = 5
idle      = 2
loop      = false
end       = 5           # the same baseline, repeated

hailo.api   = async
hailo.depth = 8         # matches the 11-22 and 11-23 thermal runs, so the
                        # ResNet-50 figure here is directly comparable to them

# FIXED AT THE FAN'S MEASURED CEILING, deliberately. A throttled card draws
# LESS, so a hot tread would corrupt the very reading this plan is taking —
# maximum cooling is the way to keep every model's watts an honest measure of
# its work rather than of its temperature. 73 % is the firmware's `max_duty`
# and the tach shows 73 % and 100 % landing within 1 rpm of each other, so
# nothing is gained by asking for more. A bare `fan` holds across the idles
# too, since the plan-level fan is applied on change only.
fan = 73

# ORDER IS NOT BY POWER, ON PURPOSE. The 2026-11-23 run measured the unforced
# baseline drifting 8.1 % in natural-convection resistance across one
# afternoon. Running these in increasing-power order would alias that drift
# straight onto the quantity being measured. So the order is scrambled, and
# RESNET-50 RUNS FIRST AND LAST: if its two treads give the same watts, there
# was no drift worth correcting; if they do not, the difference is the
# correction, and it is measured rather than assumed.
model = resnet50
model = yolov8m
model = scrfd_500m
model = yolov8s
model = arcface
model = scrfd_10g
model = osnet
model = scrfd_2.5g
model = resnet50

# WHAT TO READ AFTERWARDS, per step:
#
#   0000:*_INA228_POWER   the rail. THE HEADLINE — take the LAST MINUTE of each
#                         tread, not the mean: leakage follows temperature at
#                         ~18.68 mW/C, so a tread still warming reads low.
#   0000:*_CLK            must be 400 MHz for every sample. Any dip means that
#                         tread throttled and its wattage is not a measure of
#                         the model's work. Do not use the clock alone to rule
#                         throttling out on a DeepX — on Hailo it is reliable.
#   hailo_fps             the achieved rate, which with the GOP/frame table
#                         turns each model's watts into achieved TOPS
#   usb *_FAN_DUTY        the board's own readback. Confirm 73 %, not the
#                         requested number (the EMC2101 quantises to 1/63)
#   usb *_MAX31855        the heatsink. Each tread is also a (W, tc) pair at a
#                         known duty, which is the first point of the W axis
#                         this whole exercise is about
#   bench_target_fps      empty throughout: nothing is capped here
#
#   The two ResNet-50 treads differenced = the session drift. Everything else
#   in this run inherits that as its noise floor, the same way the three-arm
#   run inherited 0.67 C from its replicate pair.
#
# WHAT COMES NEXT, and why it is not in this file. Once the real load points
# are known, the fitting run holds a few FIXED DUTIES and steps the load within
# each, which yields the steady-state gain and the time constant from the same
# data. That schedule cannot be written sensibly until this one has run, since
# its whole structure depends on how wide the W spread turns out to be.
#
# And one tread of it is a confound test the `fps` key was added for: cap
# ResNet-50 down to whatever YOLOv8m draws at full rate. If `tc` matches at
# matched `W`, model identity is irrelevant and every model's samples pool into
# one fit; if it does not, the model needs an input we have not got.
