# mb-benchmark-gui — INA228 circuit → accelerator mapping.
#
# Each line maps a USB port-path to the label shown in the Power legend for the
# INA228 on that FT232H bridge.
#
#   <port-path> = <label>[, <flag>...]
#
# FLAGS (comma-separated after the label):
#   invert   negate CURRENT and CHARGE for this rail. The INA228 reports the
#            shunt drop SIGNED, so a breakout wired with IN+/IN- reversed shows
#            a card that is drawing as negative current. VBUS, POWER and ENERGY
#            come from unsigned registers and are unaffected — only the two
#            signed families move. Per-rail on purpose: the harness can be
#            corrected one breakout at a time.
#
#            Verified before setting it here: VBUS x |CURRENT| matched POWER to
#            within 0.2% on all four rails, so only the direction was wrong.
#
# KEY is the USB *port-path* (sysfs kernel name, e.g. "1-1") — the physical port
# the bridge is plugged into. It is STABLE across replug/reboot, unlike the
# bus-devnum "usb 1-3" string the GUI shows. Find a bridge's port-path with:
#     for d in /sys/bus/usb/devices/*/; do \
#       [ "$(cat $d/idVendor 2>/dev/null)" = 0403 ] && \
#       [ "$(cat $d/idProduct 2>/dev/null)" = 6014 ] && \
#       echo "$(basename $d)  (devnum $(cat $d/devnum))"; done
#
# VALUE is free text, but matching an accelerator's name exactly ("Hailo",
# "DeepX", "Axelera", "MemryX") is what makes this shunt fold onto that card's
# legend row, share its colour, and feed its fps/W and frames/joule figures.
# An unmapped bridge falls back to a standalone "INA228#<n>" row.
#
# Searched in order: $MB_INA228_CONFIG, this file, then
# ~/.config/mb-benchmark-gui/ina228.conf.
#
# RA6M5 PROBE BOARDS (SparkFun Thing Plus RA6M5, firmware/mb-probe-ra6m5) use
# the same file and the same flags, but the KEY is the board's USB serial number
# — the RA6M5's unique id, 32 hex digits — not a port-path. Unlike an FT232H the
# board carries a serial, so its mapping follows the board between ports. The
# startup log prints it for an unmapped board:
#     RA6M5 @ usb 9-1: ... serial 4201286835363532A8CC46534E4B2CC6, INA228 unmapped
# or read it from /dev/serial/by-id/usb-Arduino_SparkFun_Thing_Plus_RA6M5_<serial>-if00.

# All four accelerators are instrumented. The two four-part paths are bridges
# behind a second hub tier — the port-path is the full chain, so it grows a
# component per hub. Re-read them with the loop above after any replug into a
# different port; the path follows the physical socket, not the device.
# All four breakouts on this rig are wired IN+/IN- reversed, hence `invert` on
# every line. If a shunt is ever rewired the right way round, drop the flag on
# that line alone.
1-1.1   = Hailo,   invert
1-1.2   = Axelera, invert
1-1.4.1 = DeepX,   invert
1-1.4.2 = MemryX,  invert

# RA6M5 boards. Strix Halo AI PC: one board on the Hailo-8's rail. Its
# breakout is wired IN+/IN- reversed as well (current read -0.150 A at
# 0.499 W, 2026-11-16), hence `invert`.
4201286835363532A8CC46534E4B2CC6 = Hailo, invert
