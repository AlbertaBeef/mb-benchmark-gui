# mb-benchmark-gui — INA228 circuit → accelerator mapping.
#
# Each line maps a USB port-path to the label shown in the Power legend for the
# INA228 on that FT232H bridge.
#
#   <port-path> = <label>
#
# KEY is the USB *port-path* (sysfs kernel name, e.g. "1-1") — the physical port
# the bridge is plugged into. It is STABLE across replug/reboot, unlike the
# bus-devnum "usb 1-3" string the GUI shows. Find a bridge's port-path with:
#     for d in /sys/bus/usb/devices/*/; do \
#       [ "$(cat $d/idVendor 2>/dev/null)" = 0403 ] && \
#       [ "$(cat $d/idProduct 2>/dev/null)" = 6014 ] && \
#       echo "$(basename $d)  (devnum $(cat $d/devnum))"; done
#
# VALUE is free text, but matching an accelerator's name exactly ("Hailo",
# "DeepX", "Axelera", "MemryX") is what makes this shunt fold onto that card's
# legend row, share its colour, and feed its fps/W and frames/joule figures.
# An unmapped bridge falls back to a standalone "INA228#<n>" row.
#
# Searched in order: $MB_INA228_CONFIG, this file, then
# ~/.config/mb-benchmark-gui/ina228.conf.

# All four accelerators are instrumented. The two four-part paths are bridges
# behind a second hub tier — the port-path is the full chain, so it grows a
# component per hub. Re-read them with the loop above after any replug into a
# different port; the path follows the physical socket, not the device.
1-1.1   = Hailo
1-1.2   = Axelera
1-1.4.1 = DeepX
1-1.4.2 = MemryX
