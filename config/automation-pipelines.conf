# mb-benchmark — unattended pipeline sweep.
#
#   ./build/mb-benchmark --automation config/automation-pipelines.conf
#
# Every multi-inference pipeline in config/models.conf, one run each. The format
# is documented at the top of automation-models.conf; mix `model` and `pipeline`
# lines freely in one file if you want both in a single session.

[automation]
start     = 5
benchmark = 30
idle      = 10
loop      = false
end       = 10

hailo.api     = async
hailo.depth   = 4
memryx.api    = async
memryx.depth  = 4
deepx.api     = async
deepx.depth   = 4
axelera.depth = 2
axelera.cores = 1

[plan]
# Five pipelines. At 30 + 10 minutes each, one pass is about 3h20m.
pipeline = track_yolov8s
pipeline = track_yolov8m
pipeline = face_scrfd_500m
pipeline = face_scrfd_2.5g
pipeline = face_scrfd_10g
