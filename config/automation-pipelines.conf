# mb-benchmark — unattended pipeline sweep.
#
#   ./build/mb-benchmark --automation config/automation-pipelines.conf
#
# Every multi-inference pipeline in config/models.conf, one run each. The format
# is documented at the top of automation-models.conf; mix `model` and `pipeline`
# lines freely in one file if you want both in a single session.

[automation]
start     = 5
benchmark = 30
idle      = 10
loop      = false
end       = 10

hailo.api     = async
hailo.depth   = 8
memryx.api    = async
memryx.depth  = 8
deepx.api     = async
deepx.depth   = 8
# Double buffering OFF (2026-09-20). Until that date this line was inert --
# the runner joined instance properties with ';' and libaxruntime splits on
# '\n', so nothing after the first key ever reached the card. Now that it
# works it is worth ~23%, and it is also the one thing that differs from every
# 4-core run this host has survived. An unattended overnight plan is the worst
# place to find out; turn it back on for a deliberate soak, not for a sweep.
axelera.double_buffer = false
axelera.cores = 1

[plan]
# Five pipelines. At 30 + 10 minutes each, one pass is about 3h20m.
pipeline = track_yolov8s
pipeline = track_yolov8m
pipeline = face_scrfd_500m
pipeline = face_scrfd_2.5g
pipeline = face_scrfd_10g
