# mb-benchmark-gui — model catalog and download sources.
#
# This file *is* the catalog: the Models and Pipelines lists in the GUI are
# built from it. Adding a model is an edit here, not a rebuild.
#
# Models are downloaded on first run into
#
#     models/<vendor>/<accelerator>/
#       hailo/hailo-8      axelera/metis      deepx/dx-m1      memryx/mx3
#       qualcomm/iq9075
#
# — except qualcomm/, which is never downloaded: a QNN context binary is a build
# product of the board it will run on, not a portable artifact. See [vendor:qualcomm].
#
# relative to the repo (resolved from the binary, so the working directory does
# not matter). Anything already present is left alone. Set MB_BENCH_NO_DOWNLOAD=1
# to skip fetching entirely and use only what is on disk.
#
# Sources below are lifted from the vendor scripts in the sibling project:
#   ../envic_ai_python/ai_hailo/models/get_hailo8_models.sh
#   ../envic_ai_python/ai_deepx/models/get_deepx_models.sh
#   ../envic_ai_python/ai_axelera/models/get_axelera_models.sh
# MemryX has no such script; its source is the Model Explorer, see below.
#
# ---------------------------------------------------------------------------
# Vendors: where each backend's artifacts come from and where they land.
#
#   accelerator = the <accelerator> path component
#   url         = base URL; the model's artifact name is appended
#   fetch       = file | zip | zipfile | none
#                 file    — GET <url>/<artifact>, save as-is
#                 zip     — GET <url>/<artifact>.zip, extract `strip` flat into
#                           a directory named <artifact>
#                 zipfile — GET <url>/<stem>.zip, extract just the <artifact>
#                           member from the archive root. MemryX archives also
#                           carry a `<name>_post.onnx|tflite` head for host-side
#                           decode; it is deliberately not extracted, since no
#                           backend runs post-processing in the timed loop.
#                 none    — no public source; drop files in by hand
#   strip       = zip only. %m expands to the artifact name.
# ---------------------------------------------------------------------------

[vendor:hailo]
accelerator = hailo-8
# Hailo Model Zoo, precompiled HEFs.
# https://github.com/hailo-ai/hailo_model_zoo/blob/master/docs/PUBLIC_MODELS.rst
url = https://hailo-model-zoo.s3.eu-west-2.amazonaws.com/ModelZoo/Compiled/v2.18.0/hailo8
fetch = file

[vendor:deepx]
accelerator = dx-m1
# DeepX ModelZoo, Q-Lite .dxnn builds. https://developer.deepx.ai/modelzoo
url = https://sdk.deepx.ai/modelzoo/dxnn/2_3_0
fetch = file

[vendor:axelera]
accelerator = metis
# Voyager SDK prebuilt catalog. Each zip holds build/<m>/<m>/1/{model.json,
# manifest.json, pool_*.bin, ...}; that one directory is flattened into <m>/.
url = https://media.axelera.ai/artifacts/prebuilt/voyager-sdk-v1.5.3
fetch = zip
strip = build/%m/%m/1

[vendor:memryx]
accelerator = mx3
# MemryX Model Explorer — https://developer.memryx.com/model_explorer/models.html
# Each model is served as a zip holding exactly one .dfp at the archive root,
# named after the model — hence `zipfile` rather than `zip` (which is Axelera's
# shape: an archive containing a whole model directory).
url = https://developer.memryx.com/model_explorer/2p2
fetch = zipfile

[vendor:qualcomm]
accelerator = iq9075
# No URL, and there cannot be one. A Qualcomm artifact here is a *context
# binary* built by qnn-context-binary-generator and locked to the HTP
# architecture of the part that built it (v73 on QCS9075) — a build product of
# this board, not a portable download. Every qualcomm key below is therefore
# `source = local`; the files are produced by the pipeline in
# ~/envic_models (run_local.sh) after AI Hub compiles the .dlc.
fetch = none

# ---------------------------------------------------------------------------
# Models. One section per logical model; one key per vendor naming that
# vendor's artifact. A vendor with no key has no build and is greyed out.
#
# <vendor>.source = local  marks an artifact that exists but is not downloadable
# (locally compiled). It is used if present and never fetched.
# ---------------------------------------------------------------------------

[model:resnet50]
name = ResNet-50
detail = image classification · 224×224
# The classic throughput yardstick, so it is the one row where all three
# backends run the *same* topology from each vendor's own catalog.
# NB the Axelera archive is ~1.15 GB — by far the largest thing fetched here.
hailo = resnet_v1_50.hef
deepx = ResNet50.dxnn
axelera = resnet50-imagenet-onnx
memryx = ResNet_50_MXA_Optimized_224_224_3_onnx.dfp
# ONNX Model Zoo resnet50-v1-12, int8 via AI Hub.
#
# MUST be quantized *inside* the compile job
# (--quantize_full_type int8 on submit_compile_job). The usual two-step path —
# submit_quantize_job then compile its target model — is broken for this model:
# the QDQ export it produces has 168 tensors marked EXTERNAL that also carry
# inline float_data, which AI Hub's own compiler rejects; and repairing that by
# hand yields a DLC that will not compose on HTP ("Failed to validate op
# resnetv17_conv0_fwd"), failing identically in AI Hub's own profile job on real
# hardware. See ~/envic_models/retry_resnet50_final.py.
#
# Calibrated on the Aerex footage rather than ImageNet: for a throughput
# benchmark that is immaterial (int8 fixes the bitwidths and the graph;
# calibration only sets the scales, and nothing here decodes outputs) but it is
# NOT accuracy-validated.
qualcomm = resnet50_ctx.bin
qualcomm.source = local

[model:yolov8s]
name = YOLOv8s
detail = person detection · 640×640
hailo = yolov8s.hef
deepx = YoloV8S.dxnn
axelera = yolov8s-coco-onnx
memryx = YOLO_v8_small_640_640_3_onnx.dfp
# Split boxes/scores, same treatment and same reason as YOLOv8m — see there.
qualcomm = yolov8s_split_ctx.bin
qualcomm.source = local

[model:yolov8m]
name = YOLOv8m
detail = person detection · 640×640
hailo = yolov8m.hef
deepx = YoloV8M.dxnn
axelera = yolov8m-coco-onnx
# MemryX serves this one compiled from TFLite rather than ONNX; the .dfp is
# what matters here and the name follows the archive either way.
memryx = YOLO_v8_medium_640_640_3_tflite.dfp
# The *split* build: the stock Ultralytics export fuses boxes (0-640 px) and
# class scores (0-1) into one [1,84,8400] tensor, and QNN assigns one
# quantization scale per output tensor, so the box range sets a uint8 step of
# ~2.65 and every score quantizes to zero. Removing the final Concat and
# publishing boxes/scores separately fixes it and is marginally faster (one
# fewer op). The benchmark never decodes outputs, so this makes no difference to
# the frame rate — it is here so the row measures the artifact you would deploy.
qualcomm = yolov8m_split_ctx.bin
qualcomm.source = local

[model:osnet]
name = OSNet x1.0
detail = person re-identification · 256×128
hailo = osnet_x1_0.hef
axelera = osnet-x1-0-market1501-onnx
# Not in the DeepX ModelZoo — compiled locally with DX-COM from
# osnet_x1_0_market.onnx (see ai_deepx/models/osnet/deploy.sh in the sibling
# project). Drop the result in models/deepx/dx-m1/osnet.dxnn to enable it.
deepx = osnet.dxnn
deepx.source = local
qualcomm = osnet_x1_0_ctx.bin
qualcomm.source = local

[model:scrfd_500m]
name = SCRFD-500M
detail = face detection · 640×640
hailo = scrfd_500m.hef
deepx = SCRFD500M.dxnn
qualcomm = scrfd_500m_ctx.bin
qualcomm.source = local

[model:scrfd_2.5g]
name = SCRFD-2.5G
detail = face detection · 640×640
hailo = scrfd_2.5g.hef
deepx = SCRFD2_5G.dxnn
qualcomm = scrfd_2.5g_ctx.bin
qualcomm.source = local

[model:scrfd_10g]
name = SCRFD-10G
detail = face detection · 640×640
hailo = scrfd_10g.hef
deepx = SCRFD10G.dxnn
qualcomm = scrfd_10g_ctx.bin
qualcomm.source = local

[model:arcface]
name = ArcFace MobileFaceNet
detail = face recognition · 112×112
hailo = arcface_mobilefacenet.hef
deepx = arcface_mobilefacenet.dxnn
# The Voyager prebuilt catalog ships facenet-lfw-onnx, not ArcFace; this one is
# a custom Voyager compile. Drop the compiled model directory in
# models/axelera/metis/ to enable it.
axelera = arcface_mobilefacenet--112x112_quant_axelera_metis_1
axelera.source = local
# MobileFaceNet — "mbf" is what the AI Hub job and the Aerex cascade call it.
qualcomm = mbf_ctx.bin
qualcomm.source = local

# ---------------------------------------------------------------------------
# Pipelines. `members` lists model ids in run order; every stage runs once per
# benchmark frame on the same card. A pipeline is offered for a backend only
# when every stage resolves there.
# ---------------------------------------------------------------------------

[pipeline:track_yolov8s]
name = People Tracking · YOLOv8s
detail = person detection + OSNet ReID
members = yolov8s, osnet

[pipeline:track_yolov8m]
name = People Tracking · YOLOv8m
detail = person detection + OSNet ReID
members = yolov8m, osnet

[pipeline:face_scrfd_500m]
name = Face Recognition · SCRFD-500M
detail = face detection + ArcFace
members = scrfd_500m, arcface

[pipeline:face_scrfd_2.5g]
name = Face Recognition · SCRFD-2.5G
detail = face detection + ArcFace
members = scrfd_2.5g, arcface

[pipeline:face_scrfd_10g]
name = Face Recognition · SCRFD-10G
detail = face detection + ArcFace
members = scrfd_10g, arcface
